name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy || true
      - name: Lint (ruff)
        run: python -m ruff check src tests || true
      - name: Typecheck (mypy)
        run: python -m mypy src || true
      - name: Tests
        run: PYTHONPATH=src python -m pytest -q
      - name: CLI smoke
        run: |
          chmod +x ipghost.sh
          ./ipghost.sh --help
          ./ipghost.sh --version
          PYTHONPATH=src python -m ipghost --help
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
