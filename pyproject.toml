[project]
name = "ipghost"
version = "0.1.0"
description = "IPGHOST — Global IP Intelligence & Geolocation CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IPGHOST Contributors" }]
keywords = ["geoip", "ip-intelligence", "cli", "network", "osint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.scripts]
ipghost = "ipghost.cli:main"

[project.urls]
Homepage = "https://github.com/t1-haaaa/ipghost"
Repository = "https://github.com/t1-haaaa/ipghost"
Issues = "https://github.com/t1-haaaa/ipghost/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["UP045"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
